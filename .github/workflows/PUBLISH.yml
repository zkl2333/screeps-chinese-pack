name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn

      - name: Setup Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn --version

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Test
        run: yarn test --runInBand

      - name: Lint
        run: yarn lint

      - name: Build
        run: yarn build

      - name: Upload userscript
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: userscript
          path: dist/main.js

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download userscript
        uses: actions/download-artifact@v4
        with:
          name: userscript
          path: build

      - name: Push dist to dist branch
        run: |
          git fetch origin dist
          git worktree add "$RUNNER_TEMP/dist-branch" origin/dist

          mkdir -p "$RUNNER_TEMP/dist-branch/dist"
          cp build/main.js "$RUNNER_TEMP/dist-branch/dist/main.js"

          git -C "$RUNNER_TEMP/dist-branch" config user.name "CI Publisher"
          git -C "$RUNNER_TEMP/dist-branch" config user.email "ci-publisher@users.noreply.github.com"
          git -C "$RUNNER_TEMP/dist-branch" add dist/main.js

          if git -C "$RUNNER_TEMP/dist-branch" diff --cached --quiet; then
            echo "dist/main.js 无变化"
            exit 0
          fi

          git -C "$RUNNER_TEMP/dist-branch" commit -m "build: publish dist/main.js"
          git -C "$RUNNER_TEMP/dist-branch" push origin HEAD:dist
